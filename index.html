<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f5f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131313" />
    <title>Solora</title>
    <script>
      // Apply light/dark before first paint so boot never flashes the wrong theme.
      // Saved settings and sign-ins from before the Solora rename were kept
      // under lumora* keys; carry them over once.
      try {
        for (var i = localStorage.length - 1; i >= 0; i--) {
          var k = localStorage.key(i);
          if (k && k.indexOf("lumora") === 0) {
            var n = "solora" + k.slice(6);
            if (localStorage.getItem(n) === null) localStorage.setItem(n, localStorage.getItem(k));
            localStorage.removeItem(k);
          }
        }
      } catch (e) {}
      try {
        var t = localStorage.getItem("solora-theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <style>
      /* Boot frame: the exact last frame of the Plymouth splash
         (os/rootfs/usr/share/plymouth/themes/solora), drawn before any JS so
         the hand-off from Linux boot to the app is invisible. boot-splash.png
         is that frame's text (os/tools/make-splash.swift), 2x of Plymouth's
         1080p units, so it scales with the panel height as Plymouth does.
         main.tsx fades it out once React has painted. */
      #boot { position: fixed; inset: 0; z-index: 2147483647; background: #0a0a0f; transition: opacity 500ms ease-out; }
      #boot.boot-done { opacity: 0; pointer-events: none; }
      #boot img { position: absolute; left: 50%; top: 50%; height: 26.065vh; transform: translate(-50%, -50%); }
    </style>
  </head>

  <body>
    <div id="boot" aria-hidden="true">
      <img src="/boot-splash.png" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
